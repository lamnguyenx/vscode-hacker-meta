# CDP front door: Chromium refuses to bind CDP to anything but its own loopback
# (it ignores --remote-debugging-address), so this server block is mounted into
# the image's nginx at /etc/nginx/conf.d/cdp.conf and listens on 0.0.0.0:9324.
#
# nginx.conf includes /etc/nginx/conf.d/*.conf, and the image's init-nginx only
# rewrites /etc/nginx/sites-available/default, so this file survives container
# restarts. Keep the port in sync with scripts/info.ts (it reads this file).
server {
    listen 9324;

    location / {
        proxy_pass         http://127.0.0.1:9222;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        # Chromium echoes the Host header back in webSocketDebuggerUrl; keep the
        # host:port the client dialled so connectOverCDP uses the advertised URL.
        proxy_set_header   Host       $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
