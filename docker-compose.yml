# Shared proxy env. Uppercase for most tools, lowercase for the ones that only
# read the lowercase spelling (and for Docker's predefined build args).
x-proxy: &proxy
  HTTP_PROXY: "$HTTP_PROXY"
  HTTPS_PROXY: "$HTTPS_PROXY"
  NO_PROXY: "$NO_PROXY"
  http_proxy: "$HTTP_PROXY"
  https_proxy: "$HTTPS_PROXY"
  no_proxy: "$NO_PROXY"

services:
  code-server:
    # Built from ./docker/code-server: codercom/code-server pinned to 4.138.0,
    # plus the official Docker CLI + Compose plugin so it can drive the host
    # daemon over the mounted socket.
    build:
      context: ./docker/code-server
      # Same proxy vars as the runtime environment (only matters when building
      # behind a proxy; empty by default). BACH_REF busts the bach clone layer
      # when it changes, e.g. `BACH_REF=$(git ls-remote ... HEAD | cut -f1)`.
      args:
        <<: *proxy
        BACH_REF: ${BACH_REF:-HEAD}
        BASE_IMAGE: codercom/code-server:4.139.1
    image: vscode-hacker-meta/code-server:4.139.1
    network_mode: host
    environment:
      DOCKER_USER: ${USER}
      # Pin the vscode-hacker-rest-control HTTP endpoint so it does not drift
      # with the workspace-path hash. Override on the host with
      # `HACKER_REST_CONTROL_PORT=<port> docker compose up -d`.
      HACKER_REST_CONTROL_PORT: ${HACKER_REST_CONTROL_PORT:-40620}
    user: "${UID}:${GID}"
    # Host Docker access: the container user is not in the host's `docker`
    # group by default, so add it as a supplementary group to reach
    # /var/run/docker.sock. Override with
    # `DOCKER_GID=$(getent group docker | cut -d: -f3) docker compose up -d`.
    group_add:
      - "${DOCKER_GID:-984}"
    volumes:
      - ./dot-config/code-server:${HOME}/.config/code-server
      - ./exp/code-server/.local/share/code-server:${HOME}/.local/share/code-server
      - ${HOME}/git:${HOME}/git:ro
      # Host Docker access: lets code-server drive the host's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --bind-addr
      - 0.0.0.0:9620
      - --config
      - ${HOME}/.config/code-server/config.yaml
      - --user-data-dir
      - ${HOME}/.local/share/code-server
      # Dev/test harness: the only content the container can reach is the
      # mounted git tree + this file, so treat the session as trusted rather
      # than prompting — and rather than silently disabling every user
      # extension that lacks `capabilities.untrustedWorkspaces`. Session-scoped
      # (no client-side trusted-folders state to seed; VS Code exposes no
      # per-folder trust setting).
      - --disable-workspace-trust

  # Headed Chromium — local browser for the E2E suites and manual checks.
  #
  # This is the linuxserver/chromium image (Selkies: a real, windowed Chromium
  # on a streamed Wayland desktop — not headless). It is a local alternative to
  # the browser on pp: the suites connect to it over CDP at CDP_PORT, and you
  # can watch/drive the same browser at the canvas URL.
  #
  #   docker compose up -d chromium
  #   curl -s http://0.0.0.0:9324/json/version   # CDP
  #   https://0.0.0.0:9325                       # canvas (no auth by default)
  #
  # Both endpoints bind 0.0.0.0. The canvas is the image's nginx; CDP is a
  # second nginx server block (docker/chromium/cdp.conf) because Chromium
  # itself only ever binds CDP on its own loopback and ignores
  # --remote-debugging-address. The proxy is raw WebSocket-capable, so
  # Playwright's connectOverCDP works through it.
  #
  # Networking is `host`, deliberately: the tests open https://localhost:9620,
  # and code-server also uses host networking; a bridge container's localhost
  # would be itself. There is no `ports:` block for that reason.
  #
  # WARNING: neither CDP (9324) nor the canvas (9325) has authentication by
  # default. Both bind 0.0.0.0, so anyone who can reach this host can drive the
  # browser, open the canvas desktop, and use the code-server session in its
  # profile. Keep this on a trusted network, or tunnel it. To put basic auth
  # back on the canvas, add CUSTOM_USER and PASSWORD below.
  chromium:
    image: lscr.io/linuxserver/chromium:version-1aca5d17
    network_mode: host
    environment:
      PUID: "${UID:-1000}"
      PGID: "${GID:-1000}"
      TZ: Etc/UTC
      # The image's watchdog relaunches the desktop autostart (and so
      # Chromium) when it dies; without it a dead browser leaves the canvas
      # answering 502.
      RESTART_APP: "true"
      PIXELFLUX_WAYLAND: "true"
      # Canvas: HTTPS on 0.0.0.0. The image's nginx binds all interfaces.
      CUSTOM_HTTPS_PORT: "${CANVAS_PORT:-9325}"
      # Canvas auth is off: without PASSWORD the image's nginx serves the
      # desktop with no login. Uncomment both lines to put basic auth back
      # (and recreate the container, because init-nginx builds the htpasswd
      # file at startup).
      # CUSTOM_USER: "${CHROMIUM_USER:-chromium}"
      # PASSWORD: "${CHROMIUM_PASSWORD:-chromium}"
      # A fixed 16:9 desktop (1280x720) by default. Selkies otherwise sizes
      # the display to the viewer's window, and Chromium cannot go below 500px
      # wide. Override with CANVAS_WIDTH/CANVAS_HEIGHT, e.g. 1920x1080.
      SELKIES_MANUAL_RESOLUTION: "true"
      SELKIES_MANUAL_WIDTH: "${CANVAS_WIDTH:-1280}"
      SELKIES_MANUAL_HEIGHT: "${CANVAS_HEIGHT:-720}"
      # CDP stays on Chromium's own loopback; the nginx server block in
      # docker/chromium/cdp.conf publishes it on 0.0.0.0:9324.
      # `about:blank`: a deterministic starting page. `--ignore-certificate-
      # errors`: code-server uses a mkcert self-signed certificate.
      CHROME_CLI: >-
        --remote-debugging-port=9222
        --remote-allow-origins=*
        --ignore-certificate-errors
        --hide-crash-restore-bubble
        about:blank
    volumes:
      # Browser profile + canvas certificate/config. Survives recreation;
      # delete this directory to start from a clean browser.
      - ./exp/chromium:/config
      # CDP front door on 0.0.0.0:9324 -> Chromium's 127.0.0.1:9222.
      # Edit cdp.conf, then `docker compose restart chromium`.
      - ./docker/chromium/cdp.conf:/etc/nginx/conf.d/cdp.conf:ro
      # Managed Chromium policy (bookmark bar off); read at browser start.
      - ./docker/chromium/policies:/etc/chromium/policies/managed:ro
    shm_size: "1gb"
    restart: unless-stopped

  # Hacker Terminal Enhanced — browser dev harness.
  #
  # Serves the real history panel (media/popup.*) in a plain browser against a
  # read-only mirror of the extension's SQLite history, with hot reload on save.
  # Reuses the ws-scrcpy pattern: host networking, host UID/GID, bind-mounted
  # checkout, pinned Bun image, nothing built inside the container.
  #
  #   docker compose up -d lamnguyenx.hacker-terminal-enhanced-webview-dev
  #   # then open http://localhost:5199
  #
  # The DB is mounted from the code-server data dir above. Override HTE_DB if
  # your layout differs; a missing DB just yields an empty list.
  lamnguyenx.hacker-terminal-enhanced-webview-dev:
    # Pinned to the host's `bun --version` (1.4.0). Only Bun built-ins are used,
    # so no node_modules are needed and there is nothing to rebuild.
    image: oven/bun:1.4.0
    container_name: lamnguyenx.hacker-terminal-enhanced-webview-dev
    network_mode: host
    # Run as the host user so media/popup.js (written by `bun build --watch`)
    # stays host-owned.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /ext
    init: true
    volumes:
      # The extension checkout.
      - ./_submodules/vscode-hacker-terminal-enhanced:/ext
      # Real history DB, read-only. Mount the whole globalStorage dir so the WAL
      # `-wal`/`-shm` files are present (SQLite needs them to read a WAL db).
      - ./exp/code-server/.local/share/code-server/User/globalStorage/lamnguyenx.hacker-terminal-enhanced:/hte-db:ro
    environment:
      <<: *proxy
      # Writable home without a bind mount; nothing here needs to persist.
      HOME: "/tmp/hte-home"
      WEBVIEW_DEV_PORT: "5199"
      HTE_DB: "/hte-db/history.sqlite"
      no_proxy: "localhost,127.0.0.1,0.0.0.0,.local,.internal,.sslip.io"
    command: ["bun", "scripts/dev-webview.ts"]
    stop_grace_period: 2s
    restart: "no"

  # lamnguyenx.hacker-terminal-enhanced-webview-prod:
